name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/tests/GitHub.IntegrationTests/GitHub.IntegrationTests.csproj

      - name: Build package
        run: dotnet build src/libs/GitHub/GitHub.csproj
          --configuration Release
          --no-restore
          --maxcpucount:1

      - name: Test
        run: dotnet test src/tests/GitHub.IntegrationTests/GitHub.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --logger GitHubActions
          --maxcpucount:1

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: tryAGI.GitHub
          path: src/libs/GitHub/bin/Release/tryAGI.GitHub.*.nupkg

      - name: Publish to NuGet
        run: dotnet nuget push src/libs/GitHub/bin/Release/tryAGI.GitHub.*.nupkg
          --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_KEY }}"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        run: gh release create ${{ github.ref_name }}
          --title "${{ github.ref_name }}"
          --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
