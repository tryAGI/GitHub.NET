name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-monolith:
    name: Build and test existing SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/tests/GitHub.IntegrationTests/GitHub.IntegrationTests.csproj

      - name: Build package
        run: dotnet build src/libs/GitHub/GitHub.csproj
          --configuration Release
          --no-restore
          --maxcpucount:1

      - name: Test
        run: dotnet test src/tests/GitHub.IntegrationTests/GitHub.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --logger GitHubActions
          --maxcpucount:1

  publish-family:
    name: Build, test and publish package family
    needs: validate-monolith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read package version
        id: package
        run: |
          version=$(dotnet msbuild src/libs/GitHub/GitHub.csproj -getProperty:Version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install tested AutoSDK CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/autosdk-tool" autosdk.cli --version 0.35.0-preview.2.27

      - name: Generate, build, pack and consume package family
        run: ./scripts/test-package-family.sh
        env:
          AUTOSDK_CLI: ${{ runner.temp }}/autosdk-tool/autosdk
          GITHUB_FAMILY_VERSION: ${{ steps.package.outputs.version }}
          GITHUB_FAMILY_FEED: ${{ runner.temp }}/github-package-feed

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tryAGI.GitHub.family
          path: ${{ runner.temp }}/github-package-feed/*.nupkg

      - name: Publish to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/github-package-feed"
          push_package() {
            dotnet nuget push "$1" \
              --skip-duplicate \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_KEY"
          }
          push_package "$feed/tryAGI.GitHub.Core.$PACKAGE_VERSION.nupkg"
          for package in "$feed"/*.nupkg; do
            case "$(basename "$package")" in
              "tryAGI.GitHub.Core.$PACKAGE_VERSION.nupkg"|"tryAGI.GitHub.$PACKAGE_VERSION.nupkg") ;;
              *) push_package "$package" ;;
            esac
          done
          push_package "$feed/tryAGI.GitHub.$PACKAGE_VERSION.nupkg"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish-family]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        run: gh release create ${{ github.ref_name }}
          --title "${{ github.ref_name }}"
          --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
